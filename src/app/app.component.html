<div class="w-full h-screen flex flex-col bg-slate-50 text-slate-900 font-sans overflow-hidden">
  <!-- Navbar (always visible) -->
  <header class="flex items-center justify-between px-4 py-3 bg-white border-b border-slate-200 shrink-0 shadow-sm relative z-10">
    <div class="flex items-center gap-1">
      <img src="candidex_logo.png" alt="Candidex" class="w-8 h-8 object-contain" />
      <h1 class="text-xl font-bold text-slate-800 tracking-tight">Candidex<span class="text-indigo-600">.</span></h1>
    </div>
    
    <div class="flex items-center gap-1">
      <!-- Fullscreen Toggle Button -->
      <button (click)="toggleFullscreen()" class="p-1.5 text-slate-400 hover:text-slate-600 hover:bg-slate-100 rounded-lg transition-colors" [title]="isFullscreen ? 'Exit Fullscreen' : 'Fullscreen'">
        @if (isFullscreen) {
          <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 20V14H3m12 6V14h6M9 4v6H3m12-6v6h6" />
          </svg>
        } @else {
          <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 8V4m0 0h4M4 4l5 5m11-1V4m0 0h-4m4 0l-5 5M4 16v4m0 0h4m-4 0l5-5m11 5l-5-5m5 5v-4m0 4h-4" />
          </svg>
        }
      </button>
      
      <!-- Close Button -->
      <button (click)="closeOverlay()" class="p-1.5 text-slate-400 hover:text-slate-600 hover:bg-slate-100 rounded-lg transition-colors" title="Close (Esc)">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
        </svg>
      </button>
    </div>
  </header>

  <!-- Connected: Show full app -->
  @if (auth.isConnected()) {
    <!-- Navigation Tabs -->
    <nav class="bg-white px-4 py-3 shrink-0 border-b border-slate-200">
      <div class="flex p-1 bg-slate-100/80 rounded-xl ring-1 ring-slate-900/5">
        <a routerLink="/dashboard" routerLinkActive="bg-white text-indigo-600 shadow-sm ring-1 ring-slate-900/5 font-semibold" class="flex-1 text-center py-1.5 text-sm font-medium rounded-lg text-slate-500 hover:text-slate-700 transition-all">
          Dashboard
        </a>
        <a routerLink="/new" routerLinkActive="bg-white text-indigo-600 shadow-sm ring-1 ring-slate-900/5 font-semibold" class="flex-1 text-center py-1.5 text-sm font-medium rounded-lg text-slate-500 hover:text-slate-700 transition-all">
          New App
        </a>
        <a routerLink="/track" routerLinkActive="bg-white text-indigo-600 shadow-sm ring-1 ring-slate-900/5 font-semibold" class="flex-1 text-center py-1.5 text-sm font-medium rounded-lg text-slate-500 hover:text-slate-700 transition-all">
          Track
        </a>
      </div>
    </nav>

    <!-- Main Content Area -->
    <main class="flex-1 overflow-y-auto p-4 relative">
      <router-outlet />
    </main>
  } @else {
    <!-- Not connected: Show connect screen -->
    <div class="flex-1 flex flex-col items-center justify-center px-6 text-center">
      <div class="connect-card">
        <!-- Google Sheets icon -->
        <div class="icon-wrapper">
          <svg width="48" height="48" viewBox="0 0 48 48" fill="none">
            <rect x="8" y="4" width="32" height="40" rx="3" fill="#0F9D58"/>
            <rect x="12" y="14" width="24" height="3" rx="1" fill="white"/>
            <rect x="12" y="20" width="24" height="3" rx="1" fill="white"/>
            <rect x="12" y="26" width="24" height="3" rx="1" fill="white"/>
            <rect x="12" y="32" width="16" height="3" rx="1" fill="white"/>
            <path d="M8 7C8 5.34315 9.34315 4 11 4H30L40 14V41C40 42.6569 38.6569 44 37 44H11C9.34315 44 8 42.6569 8 41V7Z" fill="#0F9D58"/>
            <path d="M30 4L40 14H33C31.3431 14 30 12.6569 30 11V4Z" fill="#87CEAB"/>
            <rect x="14" y="20" width="20" height="2" rx="1" fill="white" opacity="0.9"/>
            <rect x="14" y="25" width="20" height="2" rx="1" fill="white" opacity="0.9"/>
            <rect x="14" y="30" width="20" height="2" rx="1" fill="white" opacity="0.9"/>
            <rect x="14" y="35" width="12" height="2" rx="1" fill="white" opacity="0.7"/>
            <line x1="24" y1="19" x2="24" y2="38" stroke="white" stroke-width="0.5" opacity="0.4"/>
          </svg>
        </div>

        <h2 class="text-lg font-semibold text-slate-800 mt-4">Connect Google Sheets</h2>
        <p class="text-sm text-slate-500 mt-1 max-w-[260px] leading-relaxed">
          Your applications are stored in your own Google Sheet. Connect once to get started.
        </p>

        <button (click)="connectGoogle()" [disabled]="isConnecting()" class="connect-btn mt-6">
          @if (isConnecting()) {
            <span class="spinner"></span>
            <span>Connecting...</span>
          } @else {
            <svg class="w-5 h-5" viewBox="0 0 24 24">
              <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 01-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z" fill="#4285F4"/>
              <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
              <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
              <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
            </svg>
            <span>Connect with Google</span>
          }
        </button>

        <p class="text-xs text-slate-400 mt-4 max-w-[240px] leading-relaxed">
          We only access Google Sheets. Your data stays in your own Google account.
        </p>
      </div>
    </div>
  }
</div>
